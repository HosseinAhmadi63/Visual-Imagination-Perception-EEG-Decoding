name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: pytest
      - run: vip-eeg verify-paper --config configs/paper.yaml
      - run: vip-eeg verify --config configs/paper.yaml --output results/verification.json
