[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-imagination-perception-eeg"
version = "1.0.0"
description = "Complete reproduction pipeline for decoding visual imagination and perception from EEG topomap sequences"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "Hossein Ahmadi", email = "hossein.ahmadi@polito.it"},
  {name = "Luca Mesin"},
]
keywords = ["EEG", "BCI", "visual imagination", "visual perception", "topomap", "CNN", "squeeze-and-excitation", "LOSO"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.5,<1.8",
  "mne>=1.8,<1.12",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
  "torch>=2.2,<3",
  "openneuro-py>=2024.2.0,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
vip-eeg = "vip_eeg.cli:main"

[project.urls]
Article = "https://doi.org/10.1109/EMBC58623.2025.11251641"
Repository = "https://github.com/HosseinAhmadi63/Visual-Imagination-Perception-EEG-Decoding"
Dataset = "https://openneuro.org/datasets/ds004306/versions/1.0.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vip_eeg = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
